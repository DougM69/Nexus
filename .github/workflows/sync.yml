name: Sync Fork and Tags

on:
  schedule:
    - cron: '0 0 * * *' # Runs every day at midnight
  workflow_dispatch: # Allows manual verification via button click

jobs:
  sync-tags:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Fetch and Sync Upstream Tag Natively
        uses: actions/github-script@v7
        with:
          script: |
            // 1. Get the latest release/tag from the original repository
            const upstream = await github.rest.repos.getLatestRelease({
              owner: 'kd9taw',
              repo: 'Nexus'
            });
            const latestTag = upstream.data.tag_name;
            console.log(`Latest upstream tag is: ${latestTag}`);

            // 2. Check if this tag already exists in your fork
            try {
              await github.rest.repos.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${latestTag}`
              });
              console.log(`Your fork already has the tag ${latestTag}. Skipping sync.`);
            } catch (error) {
              if (error.status === 404) {
                console.log(`New version detected (${latestTag}). Natively syncing fork...`);

                // 3. Trigger the native upstream merge of code commits
                await github.rest.repos.mergeUpstream({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  branch: 'main'
                });

                // 4. Get the latest commit SHA of your main branch to attach the tag to
                const mainBranch = await github.rest.repos.getBranch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  branch: 'main'
                });
                const latestSHA = mainBranch.data.commit.sha;

                // 5. Natively create and push the exact version tag to your fork
                await github.rest.git.createRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `refs/tags/${latestTag}`,
                  sha: latestSHA
                });
                console.log(`Successfully created tag ${latestTag} on your fork!`);
              } else {
                throw error;
              }
            }
