name: Sync Fork and Tags

on:
  schedule:
    - cron: '0 0 * * *' # Runs every day at midnight
  workflow_dispatch: # Allows manual verification via button click

jobs:
  sync-tags:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write # Required to allow the script to dispatch the build job

    steps:
      # Step A: Check out your fork using the standard GITHUB_TOKEN
      - name: Checkout Fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step B: Get the latest tag name from the upstream repo via API
      - name: Fetch and Sync Upstream Tag Natively
        id: check-tag
        uses: actions/github-script@v7
        with:
          script: |
            const upstream = await github.rest.repos.getLatestRelease({
              owner: 'kd9taw',
              repo: 'Nexus'
            });
            const latestTag = upstream.data.tag_name;
            console.log(`Latest upstream tag is: ${latestTag}`);

            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${latestTag}`
              });
              console.log(`Your fork already has the tag ${latestTag}. Skipping sync.`);
              core.setOutput('sync_needed', 'false');
            } catch (error) {
              if (error.status === 404) {
                console.log(`New version detected (${latestTag}). Proceeding with git sync...`);
                core.setOutput('sync_needed', 'true');
                core.setOutput('latest_tag', latestTag);
              } else {
                throw error;
              }
            }

      # Step C: Pull upstream changes using sparse checkout to completely isolate and drop their workflows
      - name: Sync and Strip Workflows
        if: steps.check-tag.outputs.sync_needed == 'true'
        run: |
          # 1. Configure local git profile
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          
          # 2. Add the original parent repository
          git remote add upstream https://github.com
          
          # 3. Enable sparse checkout to isolate tracked folders
          git sparse-checkout init --cone
          
          # 4. Explicitly block the .github/workflows directory from syncing.
          # We tell git to sync everything (*) EXCEPT files inside the workflows folder.
          git sparse-checkout set "/*" "!/.github/workflows/"
          
          # 5. Fetch the code commits from upstream
          git fetch upstream main
          
          # 6. Merge the upstream updates into your main branch.
          # Because of sparse checkout, incoming workflow files are ignored on merge.
          git merge upstream/main -m "Merge upstream changes (ignoring workflows)" -X ours --allow-unrelated-histories || true
          
          # 7. Push the clean merge back to your fork's main branch
          git push origin main

      # Step D: Resume your original tagging and dispatch logic using github-script
      - name: Complete Tagging and Dispatch
        if: steps.check-tag.outputs.sync_needed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const latestTag = '${{ steps.check-tag.outputs.latest_tag }}';
            
            // Get the fresh commit SHA of your main branch after the git push
            const mainBranch = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'main'
            });
            const latestSHA = mainBranch.data.commit.sha;

            // Create and push the exact version tag to your fork
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${latestTag}`,
              sha: latestSHA
            });
            console.log(`Successfully created tag ${latestTag} on your fork!`);

            // Explicitly trigger build-intel.yml
            console.log("Dispatching build-intel.yml workflow...");
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build-intel.yml',
              ref: 'main'
            });
            console.log("Build workflow dispatched successfully!");
