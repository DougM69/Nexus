name: Sync Fork and Tags

on:
  schedule:
    - cron: '0 0 * * *' # Runs every day at midnight
  workflow_dispatch: # Allows manual verification via button click

jobs:
  sync-tags:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write # Required to allow the script to dispatch the build job

    steps:
      # Step A: Check out your fork using the standard GITHUB_TOKEN
      - name: Checkout Fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step B: Get the latest tag name from the upstream repo via API
      - name: Fetch and Sync Upstream Tag Natively
        id: check-tag
        uses: actions/github-script@v7
        with:
          script: |
            const upstream = await github.rest.repos.getLatestRelease({
              owner: 'kd9taw',
              repo: 'Nexus'
            });
            const latestTag = upstream.data.tag_name;
            console.log(`Latest upstream tag is: ${latestTag}`);

            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${latestTag}`
              });
              console.log(`Your fork already has the tag ${latestTag}. Skipping sync.`);
              core.setOutput('sync_needed', 'false');
            } catch (error) {
              if (error.status === 404) {
                console.log(`New version detected (${latestTag}). Proceeding with git sync...`);
                core.setOutput('sync_needed', 'true');
                core.setOutput('latest_tag', latestTag);
              } else {
                throw error;
              }
            }
      # Step C: Sync upstream changes by cherry-picking commits, skipping workflow changes
      - name: Sync and Strip Workflows
        if: steps.check-tag.outputs.sync_needed == 'true'
        run: |
          # 1. Configure local git profile
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          
          # 2. Add the upstream parent repository and fetch its history
          git remote add upstream https://github.com/kd9taw/Nexus
          git fetch upstream main
          
          # 3. Create a temporary tracking branch starting at our current branch location
          git checkout -b temp-sync-branch
          
          # 4. Forcefully overwrite the runner's workspace index for workflows back to HEAD.
          # This guarantees local files are matching your remote perfectly before calculations.
          git checkout HEAD -- .github/workflows/
          
          # 5. Bring in upstream updates via cherry-picking rather than merging.
          # We fetch the merge-base commit to identify exactly where your fork diverged from the parent.
          MERGE_BASE=$(git merge-base HEAD upstream/main)
          echo "Divergence base commit is: $MERGE_BASE"
          
          # 6. Apply all the new upstream commits one by one onto our current branch structure.
          # If an upstream commit touches a workflow file, we forcefully skip changes to that file.
          git log --reverse --format="%H" ${MERGE_BASE}..upstream/main | while read commit_sha; do
            if git show --name-only "$commit_sha" | grep -q "\.github/workflows/"; then
              echo "Commit $commit_sha modifies workflows. Applying with workflow exclusion..."
              # Attempt to cherry-pick without committing automatically
              if git cherry-pick -n "$commit_sha" 2>/dev/null; then
                # Reset any staged changes targeting the protected workflows directory
                git checkout HEAD -- .github/workflows/
                git commit -C "$commit_sha" --allow-empty
              else
                # Clean up if a conflict occurred on workflows or other files
                git checkout HEAD -- .github/workflows/
                git add -A
                git commit -C "$commit_sha" --allow-empty || git cherry-pick --skip
              fi
            else
              echo "Commit $commit_sha is clean. Cherry-picking normally..."
              git cherry-pick "$commit_sha" || git cherry-pick --skip
            fi
          done
          
          # 7. Fast-forward your main local branch tracking index to match our clean temp branch
          git checkout main
          git merge temp-sync-branch
          
          # 8. Push the clean, workflow-safe history back to your repository fork
          git push origin main

      # Step D: Resume your original tagging and dispatch logic using github-script
      - name: Complete Tagging and Dispatch
        if: steps.check-tag.outputs.sync_needed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const latestTag = '${{ steps.check-tag.outputs.latest_tag }}';
            
            // Get the fresh commit SHA of your main branch after the git push
            const mainBranch = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'main'
            });
            const latestSHA = mainBranch.data.commit.sha;

            // Create and push the exact version tag to your fork
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${latestTag}`,
              sha: latestSHA
            });
            console.log(`Successfully created tag ${latestTag} on your fork!`);

            // Explicitly trigger build-intel.yml
            console.log("Dispatching build-intel.yml workflow...");
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build-intel.yml',
              ref: 'main'
            });
            console.log("Build workflow dispatched successfully!");
