name: Build Intel Mac Release

on:
  workflow_dispatch: # Keeps manual build override button active

jobs:
  build-intel:
    runs-on: macos-15-intel
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install System Dependencies
      run: |
        brew install cmake ninja gcc fftw boost node libusb
        echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig" >> $GITHUB_ENV

    - name: Install Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        targets: x86_64-apple-darwin

    - name: Install Tauri CLI
      run: |
        cargo install tauri-cli --version "^2"

    - name: Setup Frontend Build Environment
      run: |
        npm --prefix ui ci
        npm --prefix ui run build

    - name: Stage Hamlib Binaries
      run: |
        bash scripts/fetch-hamlib-unix.sh

    - name: Compile and Bundle Tauri App
      run: |
        export MACOSX_DEPLOYMENT_TARGET=10.15
        export PKG_CONFIG_PATH="$(brew --prefix)/lib/pkgconfig"
        export NEXUS_ALLOW_MISSING_AICW=1
        
        cargo tauri build \
          --features radio,custom-protocol \
          --bundles app,dmg \
          --config '{"build":{"beforeBuildCommand":""},"bundle":{"createUpdaterArtifacts":false}}'

    - name: Create and Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        # Dynamically matches the exact upstream tag name generated by the sync job
        tag_name: intel-v${{ github.run_number }} 
        name: Nexus Intel Build ${{ github.ref_name }}
        body: |
          Automated Intel Mac (x86_64) compilation of Nexus.
          Natively compiled package matching official release tag `${{ github.ref_name }}`.
        draft: false
        prerelease: false
        files: src-tauri/target/release/bundle/dmg/*.dmg
