[package]
publish = false
name = "tempo-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Nexus driving a station from another computer: the command link, Stop's second road, the audio road and what both ends of them share. No Tauri, no webview."

[lints]
workspace = true

# Each crate below is one src-tauri already builds, at the version it names there, with no feature
# it does not turn on itself: in the app's own build this crate adds nothing to the tree.
[dependencies]
# The app's log (`applog`), and what Stop's road carries of the shack's state: the microphone
# over's status and a held press's end (`mic`, `ptt_hold`), as the shack's engine publishes them.
tempo-base = { path = "../tempo-base" }
# This computer's headset: its rings, the Opus codecs both ways, the resampler and the voice keyer's
# WAV.
tempo-codec = { path = "../tempo-codec" }
# The sound devices behind the headset (tempo-audio's `headset::Headset`, on cpal): the `device`
# feature's alone, so a build without it reaches no crate of the engine.
tempo-audio = { path = "../tempo-audio", optional = true }
# The stream's wire contract (ids, keys, offers and their answers) and the network's addresses.
tempo-stream = { path = "../tempo-stream" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The command link's feeds: one raw-deflate stream for each feed (`wire`).
flate2 = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
futures-util = { version = "0.3", features = ["sink"] }
ring = "0.17"
# The command link's WebSocket, on its own TLS stream: only the handshake, so no TLS of its own and
# no root store.
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
# TLS 1.3 with raw public keys both ways (`tls`), on ring, never aws-lc.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

[features]
# This computer's own sound devices behind the headset (cpal, through tempo-audio): client mode's.
# Without it the roads run on any `audio_road::Headset`, as the tests' stand-in does, and nothing
# the crate builds on is a crate of the engine.
device = ["dep:tempo-audio", "tempo-audio/device"]
# A test build's road switch (`bench_road_switch`). Only src-tauri's feature of the same name turns
# it on: its tests fail if anything else could (`shipped_without_the_road_switch`).
bench-road-switch = []
# What src-tauri's own tests reach the roads through: the stand-in headset, a hold on the audio
# road's sender, and the off halves' arguments. On only as src-tauri's dev-dependency.
test-util = []
